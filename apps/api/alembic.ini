# Alembic config. The database URL is deliberately absent: migrations/env.py
# reads MECHA_DATABASE_URL through the app's own settings, so the CLI and the
# app can never point at different databases.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Run the repo's own linter over each generated revision, so `migrate:new`
# never leaves `pnpm check` failing.
[post_write_hooks]
hooks = ruff_fix,ruff_format
ruff_fix.type = exec
ruff_fix.executable = uv
ruff_fix.options = run ruff check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

# Logging for CLI runs only. env.py skips it when the app drives migrations
# at startup, so this never clobbers the app's own handlers.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
